data:text/html,<body style="margin:0;background:%23222;display:flex;height:100vh;align-items:center;justify-content:center"><div id=k></div><script>A=new AudioContext;k.style.display='flex';for(i=0;i<8;i++){d=document.createElement('button');d.style='width:55px;height:180px;font-size:20px';d.innerHTML=i+1;d.onmousedown=()=>{o=A.createOscillator();g=A.createGain();o.connect(g);g.connect(A.destination);o.frequency.value=220*2**(i/12);o.start();g.gain.value=.3;g.gain.exponentialRampToValueAtTime(.001,A.currentTime+.5);setTimeout(()=>o.stop(),500)};k.append(d)}</script>
